# Netlify 設定 — 静的サイト（ビルド不要）
[build]
  publish = "."
  command = ""

# 末尾スラッシュなしの綺麗なURL
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# アセットは長期キャッシュ（差し替え時は ?v=N で世代管理する運用）
# ※ Cloudflare Pages 用の _headers にも同内容あり。変更時は両方更新すること。
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# セキュリティヘッダ（全ページ共通）
# CSP: サイトは自前アセット＋Google Fontsのみ。インラインscript/style/イベント属性で
# 動いているため 'unsafe-inline' は許可（外部からのスクリプト読み込みは遮断される）。
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
